name: telegram-responder
# INSTANT path: Cloudflare Worker sends repository_dispatch per message.
# 30-min auto digest lives in ai-news-check (untouched). Manual Run = legacy poll fallback.
on:
  repository_dispatch:
    types: [telegram]
  workflow_dispatch:

jobs:
  respond:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - run: python responder.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - run: |
          git config user.name "ai-news-bot"
          git config user.email "bot@localhost"
          git add seen.json news_cache.json telegram_state.json taste.json || true
          git diff HEAD --quiet && echo "no changes" || (git commit -m "update state" && git push)
