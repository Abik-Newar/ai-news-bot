name: ai-news-check
on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      detail:
        description: 'Pack number for full viral details (0 = digest only)'
        required: false
        default: '0'
      hours:
        description: 'Lookback hours (6/12/24)'
        required: false
        default: '12'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python bot.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DETAIL_N: ${{ inputs.detail }}
          HOURS: ${{ inputs.hours }}
      - run: |
          git config user.name "ai-news-bot"
          git config user.email "bot@localhost"
          git add seen.json news_cache.json || true
          git diff --quiet && echo "no changes" || (git commit -m "update seen" && git push)
